<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortiManager - SandStorm Telecom</title>
    <link rel="stylesheet" href="/static/css/fortimgr.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">
            <svg class="topbar-logo" viewBox="0 0 28 28" width="28" height="28">
                <rect x="1" y="1" width="26" height="26" rx="3" fill="#ee3124"/>
                <path d="M7 8h14v2H7zM7 13h14v2H7zM7 18h10v2H7z" fill="#fff" opacity="0.9"/>
            </svg>
            <span class="topbar-title">FortiManager</span>
            <span class="topbar-subtitle">Central Management Console</span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <svg viewBox="0 0 48 48" width="48" height="48">
                    <rect x="2" y="2" width="44" height="44" rx="6" fill="#ee3124"/>
                    <path d="M12 14h24v3H12zM12 21h24v3H12zM12 28h18v3H12zM12 35h12v2H12z" fill="#fff" opacity="0.85"/>
                </svg>
                <h2>SandStorm Telecom</h2>
                <p>FortiManager Central Management</p>
            </div>
            {% if error %}
            <div class="error-msg">Invalid credentials. Please try again.</div>
            {% endif %}
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-login">Log In</button>
            </form>
            <p class="login-footer-text">FortiManager v7.4.3 build1234 (GA)</p>
        </div>
    </div>

    <div class="app-footer">
        FortiManager v7.4.3 build1234 &copy; Fortinet Inc. All rights reserved.
    </div>
</body>
</html>
